version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: bugboard_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: bugboard

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bugboard_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/bugboard
      JWT_ACCESS_SECRET: default_access_secret_for_dev_change_in_prod_12345
      JWT_REFRESH_SECRET: default_refresh_secret_for_dev_change_in_prod_54321
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bugboard_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data: